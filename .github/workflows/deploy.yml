name: Build & Push to Main

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: push-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache global npm modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-minify-${{ hashFiles('**/deploy.yml') }}

      - name: Install minify tools
        run: |
          npm install -g html-minifier-terser terser clean-css-cli

      - name: Build
        run: |
          mkdir build
          cp -r codes/* build/

          find build -type f -name "*.html" | while read file; do
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-tag-whitespace \
              --use-short-doctype \
              --minify-css true \
              --minify-js true \
              -o "$file" "$file"
          done

          find build -type f -name "*.css" | while read file; do
            cleancss -o "$file" "$file"
          done

          find build -type f -name "*.js" | while read file; do
            terser "$file" -c -m -o "$file"
          done

      - name: Deploy to main branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: main
          keep_files: false
