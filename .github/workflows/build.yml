name: Build & Deploy

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install minify tools
        run: |
          npm install -g html-minifier-terser terser clean-css-cli

      - name: Prepare build directory
        run: |
          mkdir build
          cp -r codes/* build/

      - name: Minify HTML
        run: |
          find build -name "*.html" | while read file; do
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-tag-whitespace \
              --use-short-doctype \
              --minify-css true \
              --minify-js true \
              -o "$file" "$file"
          done

      - name: Minify CSS
        run: |
          find build -name "*.css" | while read file; do
            cleancss -o "$file" "$file"
          done

      - name: Minify JS
        run: |
          find build -name "*.js" | while read file; do
            terser "$file" -c -m -o "$file"
          done

      - name: Deploy to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main

          find . -mindepth 1 \
            ! -path "./.git*" \
            ! -path "./README.md" \
            -exec rm -rf {} +

          cp -r build/* .

          git add .

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Auto build from dev"
          git push origin main
