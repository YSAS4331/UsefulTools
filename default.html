<!DOCTYPE html>
<html lang="ja">
<head>
  <title>UsefulTools - 日常生活に使える、便利なツール集</title>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="あとで作る">

  <link rel="icon" href="data:,">
  
  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      background: #000;
      color: #fff;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 1;
      visibility: visible;
      transition: opacity 220ms ease, visibility 220ms ease;
    }
    #app-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #app-loading .loading-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #555;
      border-top-color: #fff;
      border-radius: 50%;
      animation: app-loading-spin .8s linear infinite;
    }
    @keyframes app-loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #app-loading, #app-loading .loading-spinner { transition: none; animation: none; }
    }
  </style>
  <noscript><style>#app-loading { display: none; }</style></noscript>

  <!-- Styles -->
  <link rel="stylesheet" href="/UsefulTools/assets/styles/variable.css">
  <link rel="stylesheet" href="/UsefulTools/assets/styles/common.css">

  <!-- Scripts -->
  <script type="module" src="/UsefulTools/assets/scripts/load.js"></script>
  <script src="/UsefulTools/assets/scripts/router.js" type="module"></script>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite" aria-label="アプリを読み込んでいます">
    <span class="loading-spinner" aria-hidden="true"></span>
    <span>アプリを読み込んでいます…</span>
  </div>
  <app-header></app-header>
  <div id="app">
    <app-sidebar></app-sidebar>
    <main></main>
  </div>
</body>
</html>
