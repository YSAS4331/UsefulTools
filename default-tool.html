<!DOCTYPE html>
<html lang="ja">
<head>
  <title>ツール名 - UsefulTools</title>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ツール説明">

  <link rel="icon" href="data:,">
  
  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      background: #000;
      color: #fff;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 1;
      visibility: visible;
      transition: opacity 220ms ease, visibility 220ms ease;
    }
    #app-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #app-loading .loading-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #555;
      border-top-color: #fff;
      border-radius: 50%;
      animation: app-loading-spin .8s linear infinite;
    }
    @keyframes app-loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #app-loading, #app-loading .loading-spinner { transition: none; animation: none; }
    }
  </style>
  <noscript><style>#app-loading { display: none; }</style></noscript>

  <!-- Styles -->
  <link rel="stylesheet" href="/UsefulTools/assets/styles/variable.css">
  <link rel="stylesheet" href="/UsefulTools/assets/styles/common.css">

  <link rel="stylesheet" href="/UsefulTools/assets/styles/tools.css" data-page>
  <link rel="stylesheet" href="./style.css" data-page>

  <!-- Scripts -->
  <script type="module" src="/UsefulTools/assets/scripts/load.js"></script>
  <script src="/UsefulTools/assets/scripts/router.js" type="module"></script>

  <page-script src="/UsefulTools/assets/scripts/tools.js"></page-script>
  <page-script src="./script.js"></page-script>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite" aria-label="アプリを読み込んでいます">
    <span class="loading-spinner" aria-hidden="true"></span>
    <span>アプリを読み込んでいます…</span>
  </div>
  <app-header></app-header>
  <div id="app">
    <app-sidebar></app-sidebar>
    <main>
      <script type="application/json" id="page-settings">
{
  "tool-fullscreen": false
}
      </script>
      <article class="tool-container">
        <!-- 1. ツールアイコン ツール名 -->
        <header class="tool-header">
          <h1>
            <i class="tool-icon" data-lucide="hash"></i>
            <span class="tool-name">ツール名</span>
          </h1>
          <!-- 2. 簡単な説明 -->
          <p class="tool-lead">簡単な説明</p>

          <div class="tool-buttons">
            <button class="tool-share"><i data-lucide="share-2"></i>シェアする</button>
            <button class="tool-favorite"><i data-lucide="heart-plus"></i>お気に入り</button>
          </div>
        </header>

        <!-- 3. ツール本体 -->
        <div id="tool">
          
        </div>

        <!-- 4. 詳細（使い方・解説など） -->
        <footer class="tool-details">
          <section>
            <h2><i data-lucide="info"></i>このツールについて</h2>
            <p>詳細説明</p>
          </section>
          <section>
            <h3></h3>
            <p></p>
          </section>
        </footer>
      </article>
    </main>
  </div>
</body>
</html>
