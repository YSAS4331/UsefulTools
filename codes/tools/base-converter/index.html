<!DOCTYPE html>
<html lang="ja">
<head>
  <title>進数変換ツール - UsefulTools</title>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="2進数、8進数、10進数、16進数などの相互変換が瞬時にできる無料のオンライン進数変換ツールです。整数だけでなく、小数を含む計算や、大きな桁の数値の変換にも対応しています。プログラミングや情報処理の学習、IT業務に最適です。">

  <link rel="icon" href="data:,">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/UsefulTools/assets/styles/variable.css">
  <link rel="stylesheet" href="/UsefulTools/assets/styles/common.css">

  <link rel="stylesheet" href="/UsefulTools/assets/styles/tools.css" data-page>

  <!-- Scripts -->
  <script type="module" src="/UsefulTools/assets/scripts/load.js"></script>
  <script src="/UsefulTools/assets/scripts/router.js" type="module"></script>

  <page-script src="./script.js"></page-script>
</head>
<body>
  <app-header></app-header>
  <div id="app">
    <app-sidebar></app-sidebar>
    <main>
      <article class="tool-container">
        <!-- 1. ツールアイコン ツール名 -->
        <header class="tool-header">
          <h1>
            <i class="tool-icon" data-lucide="hash"></i>
            <span class="text-gradient tool-name">進数変換ツール</span>
          </h1>
          <!-- 2. 簡単な説明 -->
          <p class="tool-lead">2進数、8進数、10進数、16進数の相互変換を行います。値を入力すると、他の進数へリアルタイムに自動変換されます。</p>
        </header>

        <!-- 3. ツール本体 -->
        <div id="tool"></div>

        <!-- 4. 詳細（使い方・解説など） -->
        <footer class="tool-details">
          <h2><i data-lucide="info"></i>このツールについて</h2>
          <p>本ツールは、各種進数をブラウザ上でリアルタイムに相互変換できる開発者・学習者向けのシミュレーターです。主要な4つの基数（2進法、8進法、10進法、16進法）を網羅しており、入力形式の間違いを自動判定する機能を備えています。</p>
          
          <h3>基本的な使い方</h3>
          <p>変換したい進数の入力欄に数値を入力してください。入力と同時に、その他の入力欄が適切な値に自動的に更新されます。値をすべてクリアしたい場合は、下部のクリアボタンを利用してください。</p>
        </footer>
      </article>
    </main>
  </div>
