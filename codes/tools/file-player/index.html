<!DOCTYPE html>
<html lang="ja">
<head>
  <title>ファイルプレイヤー - UsefulTools</title>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="パソコンやスマホにある音声・動画ファイルをアップロードして、Web上で再生できます。バックグラウンド再生に対応しています。">

  <link rel="icon" href="data:,">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/UsefulTools/assets/styles/variable.css">
  <link rel="stylesheet" href="/UsefulTools/assets/styles/common.css">

  <link rel="stylesheet" href="/UsefulTools/assets/styles/tools.css" data-page>

  <!-- Scripts -->
  <script type="module" src="/UsefulTools/assets/scripts/load.js"></script>
  <script src="/UsefulTools/assets/scripts/router.js" type="module"></script>

  <page-script src="/UsefulTools/assets/scripts/tools.js"></page-script>
  <page-script src="./script.js"></page-script>

  <script type="application/json" id="page-settings">
{
  "tool-fullscreen": false
}
  </script>
</head>
<body>
  <app-header></app-header>
  <div id="app">
    <app-sidebar></app-sidebar>
    <main>
      <article class="tool-container">
        <!-- 1. ツールアイコン ツール名 -->
        <header class="tool-header">
          <h1>
            <i class="tool-icon" data-lucide="audio-lines"></i>
            <span class="tool-name">ファイルプレイヤー</span>
          </h1>
          <!-- 2. 簡単な説明 -->
          <p class="tool-lead">パソコンやスマホにある音声・動画ファイルをアップロードして、Web上で再生できます。バックグラウンド再生に対応しています。</p>

          <div class="tool-buttons">
            <button class="tool-share"><i data-lucide="share-2"></i>シェアする</button>
            <button class="tool-favorite"><i data-lucide="heart-plus"></i>お気に入り</button>
          </div>
        </header>

        <!-- 3. ツール本体 -->
        <div id="tool">
          
        </div>

        <!-- 4. 詳細（使い方・解説など） -->
        <footer class="tool-details">
          <section>
            <h2><i data-lucide="info"></i>このツールについて</h2>
            <p>詳細説明</p>
          </section>
          <section>
            <h3></h3>
            <p></p>
          </section>
        </footer>
      </article>
    </main>
  </div>
</body>
</html>
