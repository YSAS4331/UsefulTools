<!DOCTYPE html>
<html lang="ja">
<head>
  <title>UsefulTools - 日常生活に使える、便利なツール集</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="会員登録不要で、計算、変換、テキスト処理など日常のちょっとした面倒をWeb上でサクッと解決できる便利なツール集です。">

  <link rel="icon" href="data:,">

  <!-- Styles -->
  <link rel="stylesheet" href="/UsefulTools/assets/styles/variable.css">
  <link rel="stylesheet" href="/UsefulTools/assets/styles/common.css">
  <link rel="stylesheet" href="/UsefulTools/assets/styles/page/index.css" data-page>

  <!-- Scripts -->
  <script type="module" src="/UsefulTools/assets/scripts/load.js"></script>
  <script type="module" src="/UsefulTools/assets/scripts/router.js"></script>
</head>
<body>
  <app-header></app-header>

  <div id="app">
    <app-sidebar></app-sidebar>

    <main>
      <article>
        <section id="hero">
          <h1 id="hero-title">
            日常の「ちょっと面倒」を、
            <br>
            Web上で<span class="text-gradient">サクッと解決</span>。
          </h1>

          <p id="hero-lead">
            会員登録は不要。計算、変換、テキスト処理など、今すぐ使える便利なツール集です。
          </p>

          <div id="hero-cta">
            <button class="nostyle btn-primary">
              カテゴリから探す
            </button>

            <button class="nostyle btn-secondary">
              全ツール一覧
            </button>
          </div>
        </section>

        <div id="tools">
          <section id="popular-tools">
            <h2>
              <i data-lucide="star"></i>
              <span class="text-gradient">人気のツール</span>
            </h2>
          </section>
  
          <section id="categories">
            <h2>
              <i data-lucide="folders"></i>
              <span class="text-gradient">カテゴリ</span>
            </h2>
          </section>
  
          <section id="all-tools">
            <h2>
              <i data-lucide="blocks"></i>
              <span class="text-gradient">すべてのツール</span>
            </h2>
          </section>
  
          <section id="about">
            <h2>
              <i data-lucide="info"></i>
              <span class="text-gradient">このサイトについて</span>
            </h2>
            <p>UsefulToolsは、日常生活や仕事、勉強などで役立つ</p>
            <p>便利なWebツールを無料で提供するサイトです</p>
            <p>会員登録やインストールは不要で、</p>
            <p>ブラウザからすぐに利用できます</p>
            <p>シンプルで使いやすいツールを目指して開発しています</p>
          </section>
        </div>
      </article>
    </main>
  </div>
</body>
</html>
